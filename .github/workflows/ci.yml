name: Installer checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install installer UI dependencies
        run: python -m pip install -r installer/requirements.txt
      - name: Check shell scripts
        run: bash -n installer/install.sh installer/build_packages.sh installer/uninstall.sh helpers/*.sh
      - name: Run unit tests
        run: python -m unittest discover tests -v
      - name: Check installer dry-run
        run: python -m installer --dry-run --yes --os-release /etc/os-release
