name: Installer checks

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install installer UI dependencies
        run: python -m pip install -r installer/requirements.txt psutil
      - name: Check shell scripts
        run: bash -n installer/install.sh installer/build_packages.sh installer/uninstall.sh helpers/*.sh
      - name: Test release bootstrap
        run: bash tests/test_installer_bootstrap.sh
      - name: Run unit tests
        run: python -m unittest discover tests -v
      - name: Check installer dry-run
        run: python -m installer --dry-run --yes --os-release /etc/os-release

  smoke-ubuntu:
    name: Installer smoke test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare Ubuntu test runtime
        run: python -m pip install -r installer/requirements.txt psutil
      - name: Run complete Ubuntu installation plan
        run: python -m installer --dry-run --yes --with-wine --verbose --os-release /etc/os-release

  smoke-arch:
    name: Installer smoke test (Arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run complete Arch installation plan
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc '
              pacman -Syu --noconfirm --needed python python-pip
              python -m pip install --break-system-packages -r installer/requirements.txt psutil
              python -m installer --dry-run --yes --with-wine --verbose --os-release /etc/os-release
            '
