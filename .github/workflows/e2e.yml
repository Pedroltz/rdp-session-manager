name: Privileged RDP E2E

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      windows_fixture:
        description: Absolute path to the deterministic Windows GUI fixture on the runner
        required: false
        default: /opt/rdpsm-fixtures/windows-test.exe

permissions:
  contents: read

concurrency:
  group: privileged-rdp-e2e
  cancel-in-progress: false

jobs:
  rdp-e2e:
    name: ${{ matrix.suite }}
    runs-on: [self-hosted, linux, rdpsm-e2e]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: [desktop, remoteapps, audit, server-load, windows-app]
    env:
      RDPSM_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/${{ matrix.suite }}
      RDPSM_WINDOWS_FIXTURE: ${{ inputs.windows_fixture || '/opt/rdpsm-fixtures/windows-test.exe' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify dedicated runner
        run: |
          test -x /usr/sbin/xrdp
          systemctl is-active --quiet xrdp
          command -v Xvfb
          command -v xfreerdp3 || command -v xfreerdp
      - name: Prepare checkout CLI
        run: |
          mkdir -p "$RUNNER_TEMP/rdpsm-bin"
          tee "$RUNNER_TEMP/rdpsm-bin/rdpsm" >/dev/null <<EOF
          #!/bin/bash
          export PYTHONPATH="${GITHUB_WORKSPACE}/src:\${PYTHONPATH:-}"
          exec python3 "${GITHUB_WORKSPACE}/src/cli.py" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/rdpsm-bin/rdpsm"
      - name: Run desktop connection
        if: matrix.suite == 'desktop'
        run: sudo env PATH="$RUNNER_TEMP/rdpsm-bin:$PATH" RDPSM_E2E_ARTIFACTS_DIR="$RDPSM_E2E_ARTIFACTS_DIR" bash tests/e2e/rdp_desktop.sh
      - name: Run RemoteApp battery
        if: matrix.suite == 'remoteapps'
        run: sudo env PATH="$RUNNER_TEMP/rdpsm-bin:$PATH" RDPSM_E2E_ARTIFACTS_DIR="$RDPSM_E2E_ARTIFACTS_DIR" bash tests/e2e/test_remoteapps.sh
      - name: Run staged capacity test
        if: matrix.suite == 'server-load'
        env:
          RDPSM_LOAD_STAGES: 5 10 25
        run: sudo env PATH="$RUNNER_TEMP/rdpsm-bin:$PATH" RDPSM_E2E_ARTIFACTS_DIR="$RDPSM_E2E_ARTIFACTS_DIR" RDPSM_LOAD_STAGES="$RDPSM_LOAD_STAGES" bash tests/e2e/test_server_load.sh
      - name: Run privileged audit trail
        if: matrix.suite == 'audit'
        run: sudo env PATH="$RUNNER_TEMP/rdpsm-bin:$PATH" RDPSM_E2E_ARTIFACTS_DIR="$RDPSM_E2E_ARTIFACTS_DIR" bash tests/e2e/test_audit_trail.sh
      - name: Run Windows application connection
        if: matrix.suite == 'windows-app'
        run: |
          test -f "$RDPSM_WINDOWS_FIXTURE"
          sudo env PATH="$RUNNER_TEMP/rdpsm-bin:$PATH" \
            RDPSM_E2E_ARTIFACTS_DIR="$RDPSM_E2E_ARTIFACTS_DIR" \
            RDPSM_WINDOWS_FIXTURE="$RDPSM_WINDOWS_FIXTURE" \
            bash tests/e2e/test_windows_apps.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.suite }}-${{ github.run_id }}
          path: artifacts/${{ matrix.suite }}
          if-no-files-found: warn
          retention-days: 14
