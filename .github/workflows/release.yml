name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import re
          text = open('src/version.py', encoding='utf-8').read()
          print(re.search(r'__version__\s*=\s*["\']([^"\']+)', text).group(1))
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version%%-*}"
          test "$version" = "$tag_version" || {
            echo "Tag $tag_version does not match src/version.py version $version" >&2
            exit 1
          }

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential zstd libarchive-tools
          sudo gem install --no-document fpm

      - name: Build Debian and Arch packages
        run: ./installer/build_packages.sh

      - name: Assemble release assets
        run: |
          mkdir -p release-assets
          cp release/rdp-session-manager.deb release-assets/
          cp release/rdp-session-manager.pkg.tar.zst release-assets/
          cp installer/install.sh release-assets/install.sh
          cp installer/core.py release-assets/installer.py
          python3 -m pip install -r installer/requirements.txt --target release-assets/installer-bundle
          cp installer/core.py release-assets/installer-bundle/__main__.py
          python3 -m zipapp release-assets/installer-bundle \
            --output release-assets/installer.pyz \
            --python '/usr/bin/env python3'
          rm -rf release-assets/installer-bundle
          (
            cd release-assets
            sha256sum --binary \
              install.sh \
              installer.py \
              installer.pyz \
              rdp-session-manager.deb \
              rdp-session-manager.pkg.tar.zst \
              > SHA256SUMS
          )

      - name: Validate release assets
        shell: bash
        run: |
          required_assets=(
            install.sh
            installer.py
            installer.pyz
            rdp-session-manager.deb
            rdp-session-manager.pkg.tar.zst
            SHA256SUMS
          )
          for asset in "${required_assets[@]}"; do
            test -s "release-assets/$asset" || {
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            }
          done
          (cd release-assets && sha256sum --check SHA256SUMS)
          RDPSM_RELEASE_ASSETS_DIR="$PWD/release-assets" \
            bash tests/test_installer_bootstrap.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            gh release create "$GITHUB_REF_NAME" release-assets/*
            --title "RDP Session Manager $GITHUB_REF_NAME"
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          "${release_args[@]}"
