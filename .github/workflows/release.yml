name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import re
          text = open('src/version.py', encoding='utf-8').read()
          print(re.search(r'__version__\s*=\s*["\']([^"\']+)', text).group(1))
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version%%-*}"
          test "$version" = "$tag_version" || {
            echo "Tag $tag_version does not match src/version.py version $version" >&2
            exit 1
          }

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential zstd libarchive-tools
          sudo gem install --no-document fpm

      - name: Build Debian and Arch packages
        run: ./installer/build_packages.sh

      - name: Assemble release assets
        run: |
          mkdir -p release-assets release-work/zipapp release-work/bundle
          cp installer/install.sh release-assets/install.sh
          python3 -m pip install -r installer/requirements.txt --target release-work/zipapp
          cp installer/core.py release-work/zipapp/__main__.py
          python3 -m zipapp release-work/zipapp \
            --output release-work/bundle/installer.pyz \
            --python '/usr/bin/env python3'
          cp release/rdp-session-manager.deb release-work/bundle/
          cp release/rdp-session-manager.pkg.tar.zst release-work/bundle/
          (
            cd release-work/bundle
            sha256sum --binary \
              installer.pyz \
              rdp-session-manager.deb \
              rdp-session-manager.pkg.tar.zst \
              > SHA256SUMS
            python3 -m zipfile -c \
              ../../release-assets/rdp-session-manager-installer.zip \
              installer.pyz \
              rdp-session-manager.deb \
              rdp-session-manager.pkg.tar.zst \
              SHA256SUMS
          )

      - name: Validate release assets
        shell: bash
        run: |
          required_assets=(
            install.sh
            rdp-session-manager-installer.zip
          )
          mapfile -t published_assets < <(
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          )
          mapfile -t expected_assets < <(printf '%s\n' "${required_assets[@]}" | sort)
          test "${published_assets[*]}" = "${expected_assets[*]}" || {
            echo "Unexpected release assets: ${published_assets[*]}" >&2
            exit 1
          }
          for asset in "${required_assets[@]}"; do
            test -s "release-assets/$asset" || {
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            }
          done
          mkdir -p release-validation
          python3 -m zipfile -e \
            release-assets/rdp-session-manager-installer.zip \
            release-validation
          test "$(find release-validation -maxdepth 1 -type f | wc -l)" -eq 4
          (cd release-validation && sha256sum --check --strict SHA256SUMS)
          RDPSM_RELEASE_ASSETS_DIR="$PWD/release-assets" \
            bash tests/test_installer_bootstrap.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            gh release create "$GITHUB_REF_NAME" release-assets/*
            --title "RDP Session Manager $GITHUB_REF_NAME"
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          "${release_args[@]}"
