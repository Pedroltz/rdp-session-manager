name: Installer Checks

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    name: Build Installer Bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer bootstrap
        run: |
          python3 -m pip install -r installer/requirements.txt
          bash -n installer/*.sh tests/ci/*.sh
          bash tests/test_installer_bootstrap.sh
          python3 -m installer --dry-run --yes --os-release /etc/os-release
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential zstd libarchive-tools
          sudo gem install --no-document fpm
      - name: Build and validate installer assets
        run: |
          bash installer/build_release_assets.sh \
            "$RUNNER_TEMP/release-assets" \
            "$RUNNER_TEMP/release-work"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 1

  install-ubuntu:
    name: Install on ${{ matrix.name }}
    needs: build-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            runner: ubuntu-22.04
            with_wine: 'false'
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            with_wine: 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-release-assets
          path: release-assets
      - name: Install and verify the bundle
        run: |
          version="$(python3 -c "from src.version import __version__; print(__version__)")"
          bash tests/ci/run_installation.sh \
            bundle \
            "ci-${GITHUB_SHA}" \
            "$version" \
            debian \
            "${{ matrix.with_wine }}" \
            true \
            "$GITHUB_WORKSPACE/release-assets/rdp-session-manager-installer.zip"
      - name: Upload installation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.runner }}-logs
          path: |
            ~/.local/state/rdp-session-manager/install.log
            ~/rdp-session-manager-gui.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  install-containers:
    name: Install on ${{ matrix.name }}
    needs: build-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
            family: debian
            with_wine: 'false'
          - name: Debian 13
            image: debian:13
            family: debian
            with_wine: 'false'
          - name: Arch Linux
            image: archlinux:latest
            family: arch
            with_wine: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-release-assets
          path: release-assets
      - name: Install and verify in container
        run: |
          version="$(python3 -c "from src.version import __version__; print(__version__)")"
          bash tests/ci/run_container_installation.sh \
            "${{ matrix.image }}" \
            "${{ matrix.family }}" \
            bundle \
            "ci-${GITHUB_SHA}" \
            "$version" \
            "${{ matrix.with_wine }}" \
            "$GITHUB_WORKSPACE/release-assets/rdp-session-manager-installer.zip"
      - name: Upload installation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.family }}-${{ strategy.job-index }}-logs
          path: ci-logs/**/installation-logs/
          if-no-files-found: ignore
          retention-days: 7
